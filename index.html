<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEK - Sign Up</title>
  <link rel="stylesheet" href="./assets/loginpage.css">
</head>
<body>
  <div id="loading-screen">
    <img src="./assets/logo-2.png" alt="Website Logo" class="loading-logo">
  </div>
  <div class="survey-wrap">
  <div id="survey" class="survey-card">
    <div class="question-step active" data-step="1">
      <h2>What is your preferred language?</h2>
      <button class="survey-btn" onclick="saveAnswer('lang', 'eng', 1)">English</button>
      <button class="survey-btn" onclick="saveAnswer('lang', 'khm', 1)">ខ្មែរ</button>
      <button class="survey-btn" onclick="saveAnswer('lang', 'chi', 1)">中文</button>
    </div>
    
    <div class="question-step" data-step="2">
      <h2 id="q2">Which of these descibe you best?</h2>
      <button id='farOpt' class="survey-btn" onclick="saveAnswer('user', 'farmer', 2)">Farmer</button>
      <button id="cusOpt" class="survey-btn" onclick="saveAnswer('user', 'custom', 2)">Customer</button>
    </div>

    <div class="question-step" data-step="3">
      <h2 id="q3">Sign Up to DEK</h2>
        <form id="signupForm">
          <div class="input-group">
            <label for="regUsername" id="username">Username</label>
            <input type="text" id="regUsername" required placeholder="Username">
            <label id="error" class="signuperr">err</label>
          </div>
          <br>
          <div class="input-group">
            <label for="regAge" id="agetxt">Age</label>
            <input type="number" id="regAge" min="1" max="120" required placeholder="Age">
            <label id="error2" class="signuperr">err</label>
          </div>
          <br>
          <div class="input-group">
              <label for="regPassword" id="password">Password</label>
              <input type="password" id="regPassword" required placeholder="Password">
              <label id="error3" class="signuperr">err</label>
          </div>
          <br>
          <div class="input-group">
              <label for="retPassword" id="retpassword">Retype Password</label>
              <input type="password" id="retPassword" required placeholder="Retype password">
              <label id="error4" class="signuperr">err</label>
          </div>
          <br>
          <button type="submit" class="survey-btn" id="signUpBtn">Sign Up</button>
      </form>
    </div>
  </div>
  </div>
  <main id="main" class="main-content">
    <h1>Redirecting...</h1>
  </main>

  <script src="main.js"></script>
</body>
</html>
